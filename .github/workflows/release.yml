name: Release ModeTapper

on:
  push:
    branches:
      - 'release/v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - name: Check out exact release commit
        shell: pwsh
        run: |
          git init .
          git fetch --depth 1 "https://github.com/$env:GITHUB_REPOSITORY.git" $env:GITHUB_SHA
          git checkout --detach FETCH_HEAD
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Unexpected release commit' }

      - name: Build and verify installer
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.Substring('release/'.Length)
          if ($tag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Expected release/vMAJOR.MINOR.PATCH' }
          $notes = "docs/releases/$tag.md"
          if (!(Test-Path -LiteralPath $notes -PathType Leaf)) { throw "Add release notes at $notes" }
          ./work/Build-Installer.ps1
          $app = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path 'work/ModeTapper.exe')).Version.ToString(3)
          $setup = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path 'dist/ModeTapper.exe')).Version.ToString(3)
          if ("v$app" -ne $tag -or "v$setup" -ne $tag) { throw "Version mismatch: app $app, setup $setup, tag $tag" }

      - name: Publish notes, installer, and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.Substring('release/'.Length)
          gh release create $tag dist/ModeTapper.exe dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ModeTapper $($tag.Substring(1))" --notes-file "docs/releases/$tag.md" --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub publication failed' }
